<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title>CRICZONE — LIVE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Shaka Player -->
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app-shell">

    <header class="topbar">
        <button class="brand" onclick="showHome()" aria-label="Home">
            <span class="brand-mark">
                <img id="brandImage" src="" alt="">
                <span class="brand-fallback">C</span>
            </span>
            <span class="brand-name">CRICXCRATE</span>
        </button>

        <div class="top-actions">
            <button class="icon-btn" id="theme-btn" title="Theme" aria-label="Theme">☼</button>
            <button class="icon-btn" id="search-btn" title="Search" aria-label="Search">⌕</button>
        </div>
    </header>

    <main>
        <div id="loader" class="loader">Loading latest matches…</div>

        <!-- HOME -->
        <section id="home-view" class="home-view"></section>

        <!-- DETAIL -->
        <section id="detail-view" class="detail-view" style="display:none;">
            <button class="back-link" onclick="showHome()">← Back</button>
            <div class="detail-hero">
                <img id="detail-img" src="" alt="Match">
                <div class="detail-gradient"></div>
                <button id="share-detail-btn" class="detail-share" aria-label="Share">↗</button>
                <div class="detail-copy">
                    <div id="detail-tournament" class="eyebrow"></div>
                    <h1 id="detail-title"></h1>
                    <div class="detail-meta">
                        <span id="detail-time"></span>
                        <span>•</span>
                        <span id="detail-status"></span>
                    </div>
                    <div class="detail-actions">
                        <button class="watch-btn" onclick="document.getElementById('quality-grid')?.scrollIntoView({behavior:'smooth',block:'center'})">WATCH ↗</button>
                        <button class="ghost-btn" onclick="openShareModal(window.currentDetailIndex)">MATCH DETAILS</button>
                    </div>
                </div>
            </div>

            <div id="detail-streams" class="detail-streams">
                <div class="section-kicker">03 / PLAYBACK</div>
                <h2>Choose your stream</h2>
                <div id="dynamic-stream-content"></div>
            </div>
        </section>
    </main>

    <!-- Bottom floating navigation -->
    <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" data-nav="home" onclick="showHome()"><span>HOME</span></button>
        <button class="nav-item" data-nav="live" onclick="goToLive()"><span>LIVE</span></button>
        <button class="nav-item" data-nav="search" onclick="focusSearch()"><span>SEARCH</span></button>
        <button class="nav-item" data-nav="sports" onclick="goToDiscover()"><span>SPORTS</span></button>
        <button class="nav-item" data-nav="schedule" onclick="goToSchedule()"><span>SCHEDULE</span></button>
    </nav>
</div>

<!-- Search sheet -->
<div id="search-sheet" class="search-sheet">
    <div class="search-panel">
        <div class="sheet-head">
            <span>Search matches</span>
            <button onclick="closeSearch()">✕</button>
        </div>
        <input id="search-input" type="search" placeholder="Search team, tournament or sport…" autocomplete="off">
        <div id="search-results" class="search-results"></div>
    </div>
</div>


<!-- Native Shaka player -->
<div id="player-modal" class="player-modal">
    <div class="player-topbar">
        <button class="player-close" onclick="closePlayer()">✕</button>
        <div>
            <div class="player-live-dot"><span></span> LIVE</div>
            <div id="player-title" class="player-title">Live Stream</div>
        </div>
        <button class="player-fullscreen" onclick="toggleFullscreen()">⛶</button>
    </div>

    <div class="player-stage">
        <video id="shakaVideo" controls playsinline autoplay></video>
        <div id="player-loading" class="player-loading">
            <div class="spinner"></div>
            <span>Loading stream…</span>
        </div>
        <div id="player-error" class="player-error"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
