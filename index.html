<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050509">
<title>CRICZONE LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.min.js"></script>
</head>
<body>
<header class="ott-topbar">
  <button class="mobile-menu" onclick="window.scrollTo({top:0,behavior:'smooth'})">☰</button>
  <div class="ott-brand" onclick="filterCategory('ALL');showHome()"><span class="brand-mark">▶</span><b>criczone</b><em>LIVE</em></div>
  <nav class="ott-nav"><button onclick="showHome()">Home</button><button onclick="document.getElementById('home-view').scrollIntoView({behavior:'smooth'})">Sports</button><button onclick="document.getElementById('home-view').scrollIntoView({behavior:'smooth'})">Live TV</button></nav>
  <div class="ott-top-actions"><button onclick="openSearch()">⌕</button><button onclick="openShareModal(0)">↗</button></div>
</header>

<main>
  <div id="loader" class="ott-loader">Loading live sports…</div>
  <div id="category-container" class="ott-categories" style="display:none"></div>
  <section id="home-view" class="ott-home"></section>

  <section id="detail-view" class="detail-view" style="display:none">
    <button class="back-btn" onclick="showHome()">← Back</button>
    <button id="share-detail-btn" class="share-detail-btn">↗</button>
    <img id="detail-img" class="detail-img" src="" alt="Poster">
    <div id="detail-tournament" class="card-category"></div>
    <h1 id="detail-title"></h1>
    <p id="detail-time"></p><p id="detail-status"></p>
    <div id="quality-grid" class="quality-grid"></div>
  </section>
</main>

<div id="telegram-modal" class="tg-modal">
  <div class="tg-box">
    <div class="tg-icon">📢</div><h3 class="tg-title">Join Telegram</h3>
    <p class="tg-subtitle">Get live updates and working streams instantly.</p>
    <a href="https://t.me/Rohit_TV" target="_blank" rel="noopener" class="tg-btn">Join Now</a>
    <button class="tg-secondary-btn" onclick="startSelectedStream()">Continue to Stream</button>
  </div>
</div>

<div id="player-modal" class="shaka-modal">
  <div class="shaka-header"><b>CRICZONE LIVE</b><button onclick="closePlayer()">✕</button></div>
  <div class="shaka-stage">
    <video id="shakaVideo" class="shaka-video" controls autoplay playsinline></video>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
